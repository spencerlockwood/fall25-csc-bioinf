name: week6-pipeline

on:
  push:
    paths:
      - "week6/**"
      - ".github/workflows/actions.yml"
  pull_request:

jobs:
  run-week6:
    runs-on: ubuntu-latest

    env:
      BOX_FASTQ_URL: ${{ secrets.BOX_FASTQ_URL }}
      WHITELIST_URL: ${{ secrets.WHITELIST_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install jupyter nbconvert anndata scanpy celltypist matplotlib seaborn numpy pandas

      - name: Install Salmon + alevin-fry (Conda + Rust)
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip tar wget gzip

          # -------------------------------
          # Install Conda
          # -------------------------------
          wget https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh
          bash Miniconda3-latest-Linux-x86_64.sh -b -p $HOME/miniconda
          echo "$HOME/miniconda/bin" >> $GITHUB_PATH
          source $HOME/miniconda/bin/activate

          conda config --add channels defaults
          conda config --add channels bioconda
          conda config --add channels conda-forge

          # -------------------------------
          # Install Salmon (stable, never 404s)
          # -------------------------------
          conda install -y salmon=1.10.2

          # -------------------------------
          # Install Rust + alevin-fry
          # -------------------------------
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          cargo install --locked alevin-fry

      - name: Make scripts executable
        working-directory: week6
        run: |
          chmod +x scripts/fetch_data.sh
          chmod +x scripts/build_index.sh
          chmod +x scripts/run_alevin_fry.sh

      - name: Run Jupyter notebook
        working-directory: week6
        run: |
          jupyter nbconvert --to notebook --execute week6.ipynb --output week6_output.ipynb

      - name: Upload executed notebook as artifact
        uses: actions/upload-artifact@v4
        with:
          name: week6-results
          path: week6/week6_output.ipynb
