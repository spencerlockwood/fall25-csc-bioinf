name: Week 6 RNA-seq Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-week6:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    # -----------------------------------------
    # Correct Mambaforge installation
    # -----------------------------------------
    - name: Install Mamba (Mambaforge)
      run: |
        wget https://github.com/conda-forge/miniforge/releases/latest/download/Mambaforge-Linux-x86_64.sh
        bash Mambaforge-Linux-x86_64.sh -b -p $HOME/mambaforge
        echo "$HOME/mambaforge/bin" >> $GITHUB_PATH

    # -----------------------------------------
    # Create environment & install frytools
    # -----------------------------------------
    - name: Create scenv environment
      shell: bash -l {0}
      run: |
        mamba create -y -n scenv python=3.10 \
          alevin-fry \
          salmon \
          fastqc \
          multiqc \
          scanpy \
          anndata \
          pandas \
          numpy \
          matplotlib \
          seaborn \
          pip

        source activate scenv
        pip install frytools

    # -----------------------------------------
    # Run your shell scripts
    # -----------------------------------------
    - name: Run Week 6 shell scripts
      shell: bash -l {0}
      run: |
        source activate scenv

        echo "=== Running fetch_data.sh ==="
        bash scripts/fetch_data.sh data/toy_read_ref_set.tar.gz

        echo "=== Running build_index.sh ==="
        bash scripts/build_index.sh

        echo "=== Running run_alevin_fry.sh ==="
        bash scripts/run_alevin_fry.sh

    # -----------------------------------------
    # Execute the notebook
    # -----------------------------------------
    - name: Install Jupyter + nbconvert
      shell: bash -l {0}
      run: |
        source activate scenv
        pip install jupyter nbconvert

    - name: Execute Week 6 notebook
      shell: bash -l {0}
      run: |
        source activate scenv
        jupyter nbconvert --to notebook --execute week6.ipynb --output week6_output.ipynb

    # -----------------------------------------
    # Upload artifacts
    # -----------------------------------------
    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: week6-results
        path: |
          week6_output.ipynb
          results/
