name: Week 6 Pipeline

on:
  push:
    paths:
      - "week6/**"
      - ".github/workflows/actions.yml"
  workflow_dispatch:

jobs:
  week6:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Install Mambaforge
      # ---------------------------------------------------------
      - name: Install Mambaforge
        run: |
          set -eux
          VERSION=24.3.0-0
          INSTALLER="Mambaforge-OpenSSL3-Linux-x86_64.sh"
          URL="https://github.com/conda-forge/miniforge/releases/download/${VERSION}/${INSTALLER}"

          curl -L "$URL" -o "$INSTALLER"
          bash "$INSTALLER" -b -p "$HOME/miniforge"

          source "$HOME/miniforge/etc/profile.d/conda.sh"
          conda activate base
          conda update -y conda mamba

      # ---------------------------------------------------------
      # Create scenv environment
      # ---------------------------------------------------------
      - name: Create scenv environment
        run: |
          source "$HOME/miniforge/etc/profile.d/conda.sh"
          mamba create -y -n scenv python=3.10 alevin-fry scipy numpy pandas scikit-learn scanpy
          conda activate scenv
          python -c "import sys; print('Python OK:', sys.version)"

      # ---------------------------------------------------------
      # Extract local dataset (replaces fetch_data.sh)
      # ---------------------------------------------------------
      - name: Extract local dataset
        run: |
          set -eux
          cd week6/data
          tar -xvf toy_read_ref_set.tar.gz

          echo "Extracted dataset contents:"
          ls -R .

      # ---------------------------------------------------------
      # Run Week 6 shell scripts
      # ---------------------------------------------------------
      - name: Run Week 6 shell scripts
        run: |
          set -eux
          source "$HOME/miniforge/etc/profile.d/conda.sh"
          conda activate scenv

          # Tell scripts where the extracted files are
          export WEEK6_DATA_DIR="$GITHUB_WORKSPACE/week6/data"

          cd week6/scripts

          echo "==== Running build_index.sh ===="
          bash build_index.sh

          echo "==== Running run_alevin_fry.sh ===="
          bash run_alevin_fry.sh

      # ---------------------------------------------------------
      # Execute notebook for clustering + annotation
      # ---------------------------------------------------------
      - name: Install papermill
        run: |
          source "$HOME/miniforge/etc/profile.d/conda.sh"
          conda activate scenv
          mamba install -y papermill ipykernel

      - name: Execute week6.ipynb
        run: |
          source "$HOME/miniforge/etc/profile.d/conda.sh"
          conda activate scenv

          cd week6
          papermill week6.ipynb executed_week6.ipynb

      # ---------------------------------------------------------
      # Upload executed notebook
      # ---------------------------------------------------------
      - name: Upload executed notebook
        uses: actions/upload-artifact@v4
        with:
          name: executed-week6-notebook
          path: week6/executed_week6.ipynb
