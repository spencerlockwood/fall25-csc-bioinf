name: Week6 Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # CHECKOUT REPO
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # INSTALL MINIFORGE (mamba included)
      # -----------------------------
      - name: Install Miniforge
        shell: bash
        run: |
          wget https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh -O miniforge.sh
          bash miniforge.sh -b -p $HOME/miniforge
          echo "$HOME/miniforge/bin" >> $GITHUB_PATH

      # -----------------------------
      # INITIALIZE CONDA
      # -----------------------------
      - name: Initialize conda
        shell: bash
        run: |
          source $HOME/miniforge/bin/activate
          conda init bash

      # -----------------------------
      # CREATE ENV + INSTALL TOOLS
      # -----------------------------
      - name: Create scenv with Salmon & Alevin-fry
        shell: bash
        run: |
          source $HOME/miniforge/bin/activate
          mamba create -y -n scenv python=3.10
          mamba install -y -n scenv -c bioconda -c conda-forge salmon alevin-fry

      # -----------------------------
      # CACHE THE ENVIRONMENT (SPEED UP FUTURE RUNS)
      # -----------------------------
      - name: Cache conda environment
        id: cache-conda
        uses: actions/cache@v4
        with:
          path: $HOME/miniforge/envs/scenv
          key: ${{ runner.os }}-scenv-${{ hashFiles('**/environment.yml') }}
          restore-keys: |
            ${{ runner.os }}-scenv-

      # -----------------------------
      # RUN WEEK 6 PIPELINE
      # -----------------------------
      - name: Run Week 6 pipeline
        shell: bash
        run: |
          source $HOME/miniforge/bin/activate scenv
          python week6_pipeline.py

      # -----------------------------
      # UPLOAD RESULTS
      # -----------------------------
      - name: Upload pipeline results
        uses: actions/upload-artifact@v4
        with:
          name: week6-results
          path: |
            results/
            output/
            *.txt
            *.csv
