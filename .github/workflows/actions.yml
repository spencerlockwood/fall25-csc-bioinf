name: Run week6 notebook

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  run-notebook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ---------------------------
      # Install Mambaforge (faster, avoids libmamba conflicts)
      # ---------------------------
      - name: Set up Mambaforge
        uses: conda-incubator/setup-miniconda@v2
        with:
          installer: Mambaforge
          auto-update-conda: true
          use-mamba: true
          channels: conda-forge,bioconda,defaults
          channel-priority: strict
          # No python pin — avoids solver conflicts
          python-version: "3.10"

      - name: Check conda info
        shell: bash -l {0}
        run: |
          conda info
          conda config --show

      # ---------------------------
      # Create environment
      # ---------------------------
      - name: Create conda environment
        shell: bash -l {0}
        run: |
          mamba create -y -n week6 python=3.10 \
            salmon=1.10.2 \
            pandas \
            numpy \
            matplotlib \
            jupyterlab

      - name: Activate environment and run notebook
        shell: bash -l {0}
        run: |
          source activate week6

          # Install jupyter nbconvert for CLI execution
          mamba install -y nbconvert

          # Run notebook
          jupyter nbconvert \
            --to notebook \
            --execute week6.ipynb \
            --output week6_executed.ipynb

      # ---------------------------
      # Upload executed notebook
      # ---------------------------
      - name: Upload executed notebook artifact
        uses: actions/upload-artifact@v4
        with:
          name: week6-output
          path: week6_executed.ipynb
