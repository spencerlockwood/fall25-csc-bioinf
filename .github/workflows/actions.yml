name: Week 6 - Single-Cell RNA-seq Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  run-notebook:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Miniforge (Conda)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: sc-analysis
          python-version: "3.10"
          auto-activate-base: false
          use-mamba: true

      - name: Install bioinformatics tools
        run: |
          mamba install -y -c bioconda -c conda-forge \
            simpleaf \
            jupyter \
            nbconvert

      - name: Install Python packages with compatible versions
        run: |
          pip install "numpy<2.0"
          pip install \
            scanpy \
            pyroe \
            celltypist \
            leidenalg \
            matplotlib \
            pandas

      - name: Execute notebook
        run: |
          cd week6
          jupyter execute week6.ipynb --timeout=1800

      - name: Commit and push generated plots
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add week6/*.png || true
          git diff --staged --quiet || git commit -m "Add generated plots from CI [skip ci]"
          git push || true