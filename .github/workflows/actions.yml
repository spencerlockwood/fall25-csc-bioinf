name: Week 6 Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-week6:
    runs-on: ubuntu-latest

    steps:
    # ---------------------------------------------------------
    # 1. Checkout repository
    # ---------------------------------------------------------
    - name: Checkout
      uses: actions/checkout@v4

    # ---------------------------------------------------------
    # 2. Install Python 3.10 (IMPORTANT: Salmon compatibility)
    # ---------------------------------------------------------
    - name: Install Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    # ---------------------------------------------------------
    # 3. Install Mambaforge (fast conda installer)
    # ---------------------------------------------------------
    - name: Install Mambaforge
      uses: conda-incubator/setup-miniconda@v3
      with:
        miniconda-version: "latest"
        python-version: "3.10"
        activate-environment: scenv
        auto-update-conda: false
        use-mamba: true

    # ---------------------------------------------------------
    # 4. Install bioinformatics tools into the conda env
    # ---------------------------------------------------------
    - name: Install Salmon, Alevin-fry, and dependencies
      shell: bash -l {0}
      run: |
        mamba install -y -n scenv -c bioconda -c conda-forge \
            salmon=1.10.2 \
            alevin-fry \
            anndata \
            scanpy \
            celltypist \
            igraph \
            leidenalg

    # ---------------------------------------------------------
    # 5. Install Python packages for the notebook
    # ---------------------------------------------------------
    - name: Install Python deps (pip)
      shell: bash -l {0}
      run: |
        pip install jupyter nbconvert papermill

    # ---------------------------------------------------------
    # 6. Run the notebook
    # ---------------------------------------------------------
    - name: Execute week6 notebook
      shell: bash -l {0}
      env:
        BOX_FASTQ_URL: ${{ secrets.BOX_FASTQ_URL }}
        WHITELIST_URL: ${{ secrets.WHITELIST_URL }}
      run: |
        papermill week6/week6.ipynb week6/week6_output.ipynb

    # ---------------------------------------------------------
    # 7. Upload notebook output as artifact
    # ---------------------------------------------------------
    - name: Upload result
      uses: actions/upload-artifact@v4
      with:
        name: week6-output
        path: week6/week6_output.ipynb
