name: Week 6 Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-week6:
    runs-on: ubuntu-latest

    steps:
    # ---------------------------------------------------------
    # 1. Checkout repository
    # ---------------------------------------------------------
    - name: Checkout
      uses: actions/checkout@v4

    # ---------------------------------------------------------
    # 2. Install Mambaforge (this ADDS mamba to PATH)
    # ---------------------------------------------------------
    - name: Install Mambaforge
      uses: conda-incubator/setup-miniconda@v3
      with:
        miniforge-variant: Mambaforge
        miniforge-version: latest
        activate-environment: scenv
        python-version: "3.10"
        use-mamba: true

    # ---------------------------------------------------------
    # 3. Install bioinformatics tools
    # ---------------------------------------------------------
    - name: Install Salmon, Alevin-fry, and dependencies
      shell: bash -l {0}
      run: |
        mamba install -y -n scenv -c bioconda -c conda-forge \
            salmon=1.10.2 \
            alevin-fry \
            anndata \
            scanpy \
            celltypist \
            igraph \
            leidenalg

    # ---------------------------------------------------------
    # 4. Install Python packages via pip
    # ---------------------------------------------------------
    - name: Install Python deps (pip)
      shell: bash -l {0}
      run: |
        pip install jupyter papermill nbconvert

    # ---------------------------------------------------------
    # 5. Execute week6 notebook
    # ---------------------------------------------------------
    - name: Execute week6 notebook
      shell: bash -l {0}
      env:
        BOX_FASTQ_URL: ${{ secrets.BOX_FASTQ_URL }}
        WHITELIST_URL: ${{ secrets.WHITELIST_URL }}
      run: |
        papermill week6/week6.ipynb week6/week6_output.ipynb

    # ---------------------------------------------------------
    # 6. Upload notebook output as artifact
    # ---------------------------------------------------------
    - name: Upload result
      uses: actions/upload-artifact@v4
      with:
        name: week6-output
        path: week6/week6_output.ipynb
