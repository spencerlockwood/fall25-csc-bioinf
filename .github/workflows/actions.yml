name: Github CI

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."

      # -------------------------------------------------------------
      # Install Salmon (prebuilt binary) + dependencies
      # -------------------------------------------------------------
      - name: Install Salmon via conda
        run: |
          wget https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh -O miniconda.sh
          bash miniconda.sh -b -p $HOME/miniconda
          echo "$HOME/miniconda/bin" >> $GITHUB_PATH
          $HOME/miniconda/bin/conda config --add channels conda-forge
          $HOME/miniconda/bin/conda config --add channels bioconda
          $HOME/miniconda/bin/conda install -y salmon=1.10.2

      # -------------------------------------------------------------
      # Install alevin-fry via Rust/cargo
      # -------------------------------------------------------------
      - name: Install alevin-fry
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          cargo install --locked alevin-fry
          echo "$HOME/.cargo/bin/" >> $GITHUB_PATH

      # -------------------------------------------------------------
      # Check out code and set up Python
      # -------------------------------------------------------------
      - name: Check out repository code
        uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install jupyter nbconvert anndata scanpy celltypist matplotlib seaborn numpy pandas

      - run: echo "💡 Repository cloned."

      - name: Week 6 – Execute notebook
        working-directory: week6
        env:
          BOX_FASTQ_URL: ${{ secrets.BOX_FASTQ_URL }}
          WHITELIST_URL: ${{ secrets.WHITELIST_URL }}
        run: |
          chmod +x scripts/fetch_data.sh
          chmod +x scripts/build_index.sh
          chmod +x scripts/run_alevin_fry.sh
          jupyter nbconvert --to notebook --execute week6.ipynb --output week6_output.ipynb

      # -------------------------------------------------------------
      # Upload notebook output using v4 (required)
      # -------------------------------------------------------------
      - name: Upload week6 results
        uses: actions/upload-artifact@v4
        with:
          name: week6-results
          path: week6/week6_output.ipynb