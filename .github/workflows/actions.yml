name: Week 6 RNA-seq Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-week6:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install Mamba
      run: |
        sudo apt-get update
        sudo apt-get install -y mambaforge

    - name: Create scenv environment
      shell: bash -l {0}
      run: |
        mamba create -y -n scenv python=3.10 \
          alevin-fry \
          salmon \
          fastqc \
          multiqc \
          scanpy \
          anndata \
          pandas \
          numpy \
          matplotlib \
          seaborn \
          pip

        source activate scenv
        pip install frytools

    - name: Run Week 6 shell scripts
      shell: bash -l {0}
      run: |
        source activate scenv

        echo "=== Running fetch_data.sh ==="
        bash scripts/fetch_data.sh data/toy_read_ref_set.tar.gz

        echo "=== Running build_index.sh ==="
        bash scripts/build_index.sh

        echo "=== Running run_alevin_fry.sh ==="
        bash scripts/run_alevin_fry.sh

    - name: Install Jupyter + nbconvert
      shell: bash -l {0}
      run: |
        source activate scenv
        pip install jupyter nbconvert

    - name: Execute Week 6 notebook
      shell: bash -l {0}
      run: |
        source activate scenv
        jupyter nbconvert --to notebook --execute week6.ipynb --output week6_output.ipynb

    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: week6-results
        path: |
          week6_output.ipynb
          results/
