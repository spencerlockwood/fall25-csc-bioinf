name: Week 6 Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  week6:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------
      # 1. Checkout repo
      # ----------------------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # 2. Install Miniforge (this version always worked)
      # ----------------------------------------------------
      - name: Install Miniforge
        shell: bash
        run: |
          set -e
          wget https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh -O miniforge.sh
          bash miniforge.sh -b -p $HOME/miniforge
          source "$HOME/miniforge/etc/profile.d/conda.sh"
          conda init bash

      # ----------------------------------------------------
      # 3. Create scenv and install dependencies
      #    IMPORTANT: Salmon must install ALONE first.
      # ----------------------------------------------------
      - name: Create scenv environment
        shell: bash
        run: |
          set -e
          source "$HOME/miniforge/etc/profile.d/conda.sh"

          # Create empty environment
          mamba create -y -n scenv python=3.10
          
          # STEP 1 — Install Salmon ALONE so it cannot be downgraded
          mamba install -y -n scenv -c conda-forge -c bioconda salmon=1.10.2
          
          # STEP 2 — Install the rest
          mamba install -y -n scenv -c conda-forge -c bioconda \
            alevin-fry \
            scanpy anndata numpy pandas scipy matplotlib seaborn

      # ----------------------------------------------------
      # 4. Run Week 6 shell scripts
      # ----------------------------------------------------
      - name: Run Week 6 pipeline scripts
        shell: bash
        run: |
          set -euo pipefail

          source "$HOME/miniforge/etc/profile.d/conda.sh"
          conda activate scenv

          cd week6
          chmod +x scripts/*.sh

          echo "=== Running fetch_data.sh ==="
          ./scripts/fetch_data.sh

          echo "=== Running build_index.sh ==="
          ./scripts/build_index.sh

          echo "=== Running run_alevin_fry.sh ==="
          ./scripts/run_alevin_fry.sh

      # ----------------------------------------------------
      # 5. Execute Jupyter Notebook
      # ----------------------------------------------------
      - name: Execute week6.ipynb
        shell: bash
        run: |
          set -e
          source "$HOME/miniforge/etc/profile.d/conda.sh"
          conda activate scenv

          cd week6
          jupyter nbconvert --execute --to notebook \
            --ExecutePreprocessor.timeout=1800 \
            --output executed_week6.ipynb \
            week6.ipynb

      # ----------------------------------------------------
      # 6. Upload results
      # ----------------------------------------------------
      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: week6-results
          path: |
            week6/executed_week6.ipynb
            week6/data/**
            week6/out/**
            week6/logs/**
          retention-days: 30
