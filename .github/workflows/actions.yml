name: Github CI

on: [push]

jobs:
  submit-week5:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Information about the workflow
      - run: echo "🎉 Workflow triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 Running on ${{ runner.os }} hosted by GitHub!"
      - run: echo "🔎 Branch: ${{ github.ref }}, Repository: ${{ github.repository }}"

      # Step 2: Check out repository
      - name: Check out repository code
        uses: actions/checkout@v5

      # Step 3: Set up Python
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # Step 4: Install Python dependencies (optional, add any needed for notebook)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib jupyter nbconvert

      # Step 5: Confirm repository contents
      - run: echo "Repository contents:" && ls -R

      # Step 6: Submit week5 notebook (example: copy to a submissions folder)
      - name: Prepare week5 submission
        run: |
          mkdir -p submissions/week5
          cp week5/week5.ipynb submissions/week5/
          echo "Week 5 notebook copied to submissions/week5/"

      # Optional: Run notebook to make sure it executes without errors
      - name: Execute week5 notebook
        run: |
          jupyter nbconvert --to notebook --execute submissions/week5/week5.ipynb --output executed_week5.ipynb
