name: Run week6 notebook

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  run-notebook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ---------------------------
      # Install micromamba + create env
      # ---------------------------
      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          micromamba-version: "latest"
          environment-name: week6
          create-args: >-
            python=3.10
            pandas
            numpy
            matplotlib
            jupyterlab
            nbconvert
            salmon=1.10.2
          channels: conda-forge,bioconda,defaults
          channel-priority: strict

      - name: Print environment info
        shell: bash -l {0}
        run: |
          micromamba info
          micromamba list

      # ---------------------------
      # Run notebook
      # ---------------------------
      - name: Run week6 notebook
        shell: bash -l {0}
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute week6.ipynb \
            --output week6_executed.ipynb

      # ---------------------------
      # Upload executed notebook
      # ---------------------------
      - name: Upload executed notebook
        uses: actions/upload-artifact@v4
        with:
          name: week6-output
          path: week6_executed.ipynb
