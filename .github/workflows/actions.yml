name: week6 workflow

on:
  workflow_dispatch:

jobs:
  run-week6:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl tar gzip

          # Install alevin-fry & salmon
          pip install alevin-fry

          wget https://github.com/COMBINE-lab/salmon/releases/download/v1.10.2/salmon-1.10.2_linux_x86_64.tar.gz
          tar -xzf salmon-1.10.2_linux_x86_64.tar.gz
          echo "$PWD/salmon-1.10.2_linux_x86_64/bin" >> $GITHUB_PATH

      - name: Extract toy dataset
        run: |
          cd week6/data
          tar -xzf toy_read_ref_set.tar.gz

      - name: Run build_index.sh
        run: |
          set -e
          echo "=== Running build_index.sh ==="

          bash week6/scripts/build_index.sh \
            data/toy_ref_read/toy_human_ref/fasta/genome.fa \
            data/toy_ref_read/toy_human_ref/genes/genes.gtf \
            index

      - name: Run alevin-fry
        run: |
          set -e
          echo "=== Running run_alevin_fry.sh ==="

          bash week6/scripts/run_alevin_fry.sh \
            data/toy_ref_read/toy_read_fastq/selected_R1_reads.fastq \
            data/toy_ref_read/toy_read_fastq/selected_R2_reads.fastq \
            index \
            output

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: week6-results
          path: |
            index/
            output/
