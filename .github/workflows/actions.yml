name: Week 6 Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  week6:
    runs-on: ubuntu-latest

    env:
      BOX_FASTQ_URL: ${{ secrets.BOX_FASTQ_URL }}
      WHITELIST_URL: ${{ secrets.WHITELIST_URL }}

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      # Install Miniforge + mamba
      - name: Install Miniforge
        shell: bash
        run: |
          set -e
          wget https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh -O miniforge.sh
          bash miniforge.sh -b -p $HOME/miniforge
          source "$HOME/miniforge/etc/profile.d/conda.sh"
          conda init bash

      # Create conda env
      - name: Create scenv environment
        shell: bash
        run: |
          source "$HOME/miniforge/etc/profile.d/conda.sh"
          mamba create -y -n scenv python=3.10
          mamba install -y -n scenv -c bioconda -c conda-forge \
            salmon alevin-fry frytools \
            scanpy anndata pandas numpy scipy \
            jupyter nbconvert matplotlib seaborn

      # Extract your new toy dataset
      - name: Extract toy dataset
        shell: bash
        run: |
          cd week6/data
          tar -xzf toy_read_ref_set.tar.gz

      # Run scripts with corrected paths
      - name: Run Week 6 shell scripts
        shell: bash
        run: |
          set -e
          source "$HOME/miniforge/etc/profile.d/conda.sh"
          conda activate scenv

          cd week6
          chmod +x scripts/*.sh

          echo "=== Running fetch_data.sh ==="
          ./scripts/fetch_data.sh

          echo "=== Running build_index.sh ==="
          ./scripts/build_index.sh \
            data/toy_ref_read/toy_human_ref/fasta/genome.fa \
            data/toy_ref_read/toy_human_ref/genes/genes.gtf \
            index

          echo "=== Running run_alevin_fry.sh ==="
          ./scripts/run_alevin_fry.sh \
            data/toy_ref_read/toy_read_fastq/selected_R1_reads.fastq \
            data/toy_ref_read/toy_read_fastq/selected_R2_reads.fastq \
            index \
            out

      # Execute notebook
      - name: Execute week6.ipynb
        shell: bash
        run: |
          set -e
          source "$HOME/miniforge/etc/profile.d/conda.sh"
          conda activate scenv

          cd week6
          jupyter nbconvert --execute --to notebook \
            --ExecutePreprocessor.timeout=1800 \
            --output executed_week6.ipynb \
            week6.ipynb

      # Upload results
      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: week6-results
          path: |
            week6/executed_week6.ipynb
            week6/data/**
            week6/out/**
            week6/index/**
            week6/logs/**
          retention-days: 30