name: Week3 Testing Pipeline

on:
  push:
    branches: [ main, master ]
    paths:
      - 'week3/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'week3/**'
  workflow_dispatch:

jobs:
  test-week3:
    name: Test Week3 Codon Project
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5
        
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Install Python dependencies
        run: |
          pip install numpy
          pip install biotite
          pip list
      
      - name: Install Codon
        run: |
          mkdir -p ${HOME}/.codon
          curl -L https://github.com/exaloop/codon/releases/download/v0.19.3/codon-linux-x86_64.tar.gz \
            | tar zxvf - --strip-components=1 -C ${HOME}/.codon
          curl -L https://github.com/exaloop/seq/releases/download/v0.11.5/seq-linux-x86_64.tar.gz \
            | tar zxvf - -C ${HOME}/.codon/lib/codon/plugins
          echo "${HOME}/.codon/bin" >> $GITHUB_PATH
      
      - name: Set up Codon Python bridge
        run: |
          pip install find_libpython
          export CODON_PYTHON=$(find_libpython)
          echo "Found Python at: ${CODON_PYTHON}"
          echo "CODON_PYTHON=${CODON_PYTHON}" >> $GITHUB_ENV
      
      - name: Verify installations
        run: |
          python --version
          codon --version
          python -c "import numpy; print(f'NumPy version: {numpy.__version__}')"
          python -c "import biotite; print(f'Biotite version: {biotite.__version__}')"
          
      - name: Run performance comparison
        run: |
          cd week3
          chmod +x evaluate.sh
          echo "Running performance comparison:"
          ./evaluate.sh
          
      - name: Verify source files
        run: |
          cd week3
          echo "Source file structure:"
          find src -name "*.py" -type f
          echo "Test file structure:"
          find tests -name "*.py" -type f
          echo "Core files:"
          ls -la phylo_test.py evaluate.sh report.md