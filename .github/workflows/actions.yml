name: Week 6 Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  week6:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # -------------------------
      # Install Miniforge (stable installer)
      # -------------------------
      - name: Install Miniforge (stable)
        shell: bash
        run: |
          set -euo pipefail
          echo "Downloading Miniforge installer..."
          wget https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh -O miniforge.sh
          echo "Installing Miniforge..."
          bash miniforge.sh -b -p "$HOME/miniforge"
          echo "Adding Miniforge to PATH..."
          echo "$HOME/miniforge/bin" >> $GITHUB_PATH
          source "$HOME/miniforge/etc/profile.d/conda.sh" || true
          conda --version

      # -------------------------
      # Ensure mamba is available in base
      # -------------------------
      - name: Install mamba into base
        shell: bash -l {0}
        run: |
          set -euo pipefail
          source "$HOME/miniforge/etc/profile.d/conda.sh"
          conda install -y -n base -c conda-forge mamba
          mamba --version

      # -------------------------
      # Create env + install tools
      # -------------------------
      - name: Create scenv and install tools
        shell: bash -l {0}
        run: |
          set -euo pipefail
          source "$HOME/miniforge/etc/profile.d/conda.sh"

          mamba create -y -n scenv python=3.10

          mamba install -y -n scenv -c bioconda -c conda-forge \
            "salmon>=1.10" \
            alevin-fry \
            scanpy \
            anndata \
            pandas \
            numpy \
            scipy \
            matplotlib \
            seaborn \
            ipykernel \
            pip

          conda activate scenv
          python -c "import scanpy as sc; print('scanpy', sc.__version__)"

      # -------------------------
      # Extract your bundled dataset
      # -------------------------
      - name: Extract local dataset
        shell: bash
        run: |
          set -euo pipefail
          echo "Extracting toy_read_ref_set.tar.gz..."
          tar -xvf week6/data/toy_read_ref_set.tar.gz -C week6/data
          ls -R week6/data

      # -------------------------
      # Run scripts
      # -------------------------
      - name: Run fetch/build/quant scripts
        shell: bash -l {0}
        env:
          WHITELIST_URL: "https://github.com/f0t1h/3M-february-2018/raw/refs/heads/master/3M-february-2018.txt.gz"   # ← prevents unbound variable error
        run: |
          set -euo pipefail
          source "$HOME/miniforge/etc/profile.d/conda.sh"
          conda activate scenv

          cd week6
          chmod +x scripts/*.sh

          echo "=== Running fetch_data.sh ==="
          ./scripts/fetch_data.sh

          echo "=== Running build_index.sh ==="
          ./scripts/build_index.sh

          echo "=== Running run_alevin_fry.sh ==="
          ./scripts/run_alevin_fry.sh

      # -------------------------
      # Execute notebook
      # -------------------------
      - name: Execute week6.ipynb
        shell: bash -l {0}
        run: |
          set -euo pipefail
          source "$HOME/miniforge/etc/profile.d/conda.sh"
          conda activate scenv

          cd week6
          jupyter nbconvert --execute --to notebook \
            --ExecutePreprocessor.timeout=3600 \
            --output executed_week6.ipynb \
            week6.ipynb

      # -------------------------
      # Upload outputs
      # -------------------------
      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: week6-results
          path: |
            week6/executed_week6.ipynb
            week6/data/**
            week6/af_output/** || true
          retention-days: 7
