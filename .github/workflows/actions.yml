name: Week 6 Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-week6:
    runs-on: ubuntu-latest

    steps:
    # ---------------------------------------------------------
    # 1. Checkout repository
    # ---------------------------------------------------------
    - name: Checkout
      uses: actions/checkout@v4

    # ---------------------------------------------------------
    # 2. Install Mambaforge manually (always works)
    # ---------------------------------------------------------
    - name: Install Mambaforge manually
      shell: bash
      run: |
        wget https://github.com/conda-forge/miniforge/releases/latest/download/Mambaforge-Linux-x86_64.sh -O mambaforge.sh
        bash mambaforge.sh -b -p $HOME/mambaforge
        echo "$HOME/mambaforge/bin" >> $GITHUB_PATH
        source $HOME/mambaforge/bin/activate

    # ---------------------------------------------------------
    # 3. Create conda env and install salmon/alevin-fry
    # ---------------------------------------------------------
    - name: Create scenv environment
      shell: bash
      run: |
        source $HOME/mambaforge/bin/activate
        mamba create -y -n scenv python=3.10
        conda activate scenv
        mamba install -y -c bioconda -c conda-forge \
            salmon=1.10.2 \
            alevin-fry \
            anndata \
            scanpy \
            celltypist \
            igraph \
            leidenalg

    # ---------------------------------------------------------
    # 4. Install pip dependencies
    # ---------------------------------------------------------
    - name: Install pip deps
      shell: bash
      run: |
        source $HOME/mambaforge/bin/activate
        conda activate scenv
        pip install jupyter papermill nbconvert

    # ---------------------------------------------------------
    # 5. Execute notebook
    # ---------------------------------------------------------
    - name: Execute week6 notebook
      shell: bash
      env:
        BOX_FASTQ_URL: ${{ secrets.BOX_FASTQ_URL }}
        WHITELIST_URL: ${{ secrets.WHITELIST_URL }}
      run: |
        source $HOME/mambaforge/bin/activate
        conda activate scenv
        papermill week6/week6.ipynb week6/week6_output.ipynb

    # ---------------------------------------------------------
    # 6. Upload artifact
    # ---------------------------------------------------------
    - name: Upload result
      uses: actions/upload-artifact@v4
      with:
        name: week6-output
        path: week6/week6_output.ipynb