name: Github CI
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."

      # 4. Check out repository code
      - name: Check out repository
        uses: actions/checkout@v5

      # 5. Set up Python 3
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # 6. Install Python dependencies for notebook
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas matplotlib jupyter nbconvert

      # 7. Confirm the notebook exists
      - name: Check for notebook
        run: |
          if [ -f week5/week5.ipynb ]; then
            echo "✅ week5.ipynb found!"
          else
            echo "❌ week5.ipynb not found!"
            exit 1
          fi

      # 8. Optional: Convert notebook to HTML as a test
      - name: Test notebook conversion
        run: |
          jupyter nbconvert --to html week5/week5.ipynb
          echo "Notebook successfully converted to HTML"
