name: Week2 Testing Pipeline

on:
  push:
    branches: [ main, master ]
    paths:
      - 'week2/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'week2/**'
  workflow_dispatch:  # Allow manual triggering

jobs:
  test-week2:
    name: Test Week2 Codon Project
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install Codon
      run: |
        curl -L -o codon.tar.gz https://github.com/exaloop/codon/releases/download/v0.16.3/codon-ubuntu-22.04.tar.gz
        tar -xzf codon.tar.gz
        echo "$(pwd)/codon/bin" >> $GITHUB_PATH
        
    - name: Verify installations
      run: |
        python --version
        codon --version
        
    - name: Navigate to week2 project
      run: |
        cd week2/my-trviz-codon
        pwd
        ls -la
        
    - name: Run Codon tests
      run: |
        cd week2/my-trviz-codon
        codon run test.py
        
    - name: Test Python fallback (if Codon fails)
      run: |
        cd week2/my-trviz-codon
        python test.py
      continue-on-error: true  # This is optional fallback
        
    - name: Verify module structure
      run: |
        cd week2/my-trviz-codon
        echo "Checking module structure:"
        find . -name "*.py" -type f | head -20
        echo "Testing Python import:"
        python -c "import trviz_codon.motifs; import trviz_codon.decomposer; print('Python imports successful')"